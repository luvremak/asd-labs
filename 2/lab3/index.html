<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Візуалізація графів</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #ECE2D0;
        }
        .canvases {
            display: flex;
            gap: 20px;
            padding: 20px;
        }
        canvas {
            border: 3px solid black;
            background-color: #faf1df;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/seedrandom/3.0.5/seedrandom.min.js"></script>

</head>
<body>
    <h1>Візуалізація Графів</h1>
    <div class="canvases">
        <canvas id="neNapr" width="600" height="600"></canvas>
        <canvas id="napr" width="600" height="600"></canvas>
    </div>
    <script>
        const canvasNeNapr = document.getElementById("neNapr");
        const canvasNapr = document.getElementById("napr");
        const ctxNeNapr = canvasNeNapr.getContext("2d");
        const ctxNapr = canvasNapr.getContext("2d");

        const n = 10;
        const coef = 1 - 0.02 - 0.005 - 0.25;
        const radius = 15;

        const nodePositions = [
            { x: 120, y: 250 }, { x: 200, y: 150 }, { x: 300, y: 110 },
            { x: 400, y: 150 }, { x: 480, y: 250 }, { x: 480, y: 350 },
            { x: 400, y: 450 }, { x: 300, y: 490 }, { x: 200, y: 450 },
            { x: 120, y: 350 }
        ];

        function generateAdjacencyMatrix(symmetric, seed) {
    let matrix = [];
    let rng = new Math.seedrandom(seed);
    for (let i = 0; i < n; i++) {
        matrix[i] = [];
        for (let j = 0; j < n; j++) {
            matrix[i][j] = rng() * 2 * coef;
            matrix[i][j] = matrix[i][j] < 1 ? 0 : 1;
        }
    }
    if (symmetric) {
        for (let i = 0; i < n; i++) {
            for (let j = 0; j < n; j++) {
                if (matrix[i][j] === 1) matrix[j][i] = 1;
            }
        }
    }
    return matrix;
}


        function drawNodes(ctx) {
            nodePositions.forEach((pos, idx) => {
                ctx.fillStyle = "#DAB785";
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle = "black";
                ctx.font = "14px Times New Roman";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(`${idx + 1}`, pos.x, pos.y);
            });
        }

        function drawArrow(ctx, x, y, angle) {
            const size = 7;
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(-size, -size);
            ctx.lineTo(0, 0);
            ctx.lineTo(-size, size);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        function drawEdges(ctx, matrix, directed) {
            ctx.strokeStyle = "black";
            ctx.lineWidth = 2;
            const offset = 20;
            for (let i = 0; i < n; i++) {
                for (let j = 0; j < n; j++) {
                    if (matrix[i][j] === 1) {
                        const { x: x1, y: y1 } = nodePositions[i];
                        const { x: x2, y: y2 } = nodePositions[j];
                        ctx.beginPath();
                        ctx.moveTo(x1, y1);
                        let midX, midY;
                        if (directed && matrix[j][i] === 1 && i !== j) {
                            midX = (x1 + x2) / 2 + (y1 - y2) / offset;
                            midY = (y1 + y2) / 2 + (x2 - x1) / offset;
                            ctx.lineTo(midX, midY);
                        }
                        ctx.lineTo(x2, y2);
                        ctx.stroke();
                        if (directed) {
                            const angle = Math.atan2(y2 - y1, x2 - x1);
                            drawArrow(ctx, x2 - radius * Math.cos(angle), y2 - radius * Math.sin(angle), angle);
                        }
                    }
                }
            }
        }

        const matrixSymmetric = generateAdjacencyMatrix(true, 3301);
        const matrixDirected = generateAdjacencyMatrix(false, 4402);

        drawEdges(ctxNeNapr, matrixSymmetric, false);
        drawEdges(ctxNapr, matrixDirected, true);
        drawNodes(ctxNeNapr);
        drawNodes(ctxNapr);
    </script>
</body>
</html>
